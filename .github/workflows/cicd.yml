name: CICD

on:
  push:
    branches:
      - deploy-to-es2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: docker build -t biainili/reactjs .

      - name: Publish image to Docker Hub
        run: docker push biainili/reactjs:latest

  deploy:
    needs: build
    runs-on: self-hosted # или 'ubuntu-latest', если без self-hosted

    steps:
      - name: Pull image from Docker Hub
        run: docker pull biainili/reactjs:latest

      - name: Delete old container
        run: docker rm -f reactContainer || true

      - name: Run Docker container
        run: docker run -d -p 3000:80 --name reactContainer biainili/reactjs:latest
