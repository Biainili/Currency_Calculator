name: CICD
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build Docker Image
        run: docker build -t biainili/reactjs .
      - name: Publish image to docker hub
        run: docker push biainili/reactjs:latest

  deploy:
    needs: build
    runs-on: aws-es2
    steps:
      - name: Pull image from docker hub
        run: docker pull biainili/reactjs:latest
      - name: Delete Old Container
        run: docker rm -f reactContainer
      - name: Run docker conatiner
        run: docker run -d -p 3000:80 --name reactContainer biainili/reactjs
